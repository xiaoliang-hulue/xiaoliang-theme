<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alert - 小亮主题</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <script src="../assets/icons/lucide.min.js"></script>
  <style>
    /* Page scaffold — NOT extracted */
    body { margin: 0; padding: var(--space-3); background: var(--color-surface); font-family: var(--font-sans); color: var(--color-text); }
    .row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
    .label { width: 92px; flex-shrink: 0; font-size: var(--text-xs); line-height: 18px; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }

    /* @component-css-start */
    /* Component definitions — extracted to components.css by deterministic script */
    .alert { display: flex; align-items: flex-start; gap: var(--space-2); flex: 1; min-width: 0; padding: var(--space-3) var(--space-4); background: var(--info-bg); color: var(--info); font-size: var(--text-sm); line-height: 22px; border-radius: var(--radius-md); }
    .alert .icon { flex-shrink: 0; width: 18px; height: 18px; }
    .alert .message { flex: 1; min-width: 0; }
    .alert.info { background: var(--info-bg); color: var(--info); }
    .alert.success { background: var(--success-bg); color: var(--success); }
    .alert.warning { background: var(--warning-bg); color: var(--warning); }
    .alert.error { background: var(--error-bg); color: var(--error); }
    /* @component-css-end */
  </style>
</head>
<body>
  <div class="row">
    <span class="label">Info</span>
    <div class="alert info" role="alert">
      <i data-lucide="info" class="icon"></i>
      <span class="message">这是一条提示信息，用于向用户说明当前状态。</span>
    </div>
  </div>
  <div class="row">
    <span class="label">Success</span>
    <div class="alert success" role="alert">
      <i data-lucide="check-circle" class="icon"></i>
      <span class="message">操作已成功完成，数据已保存。</span>
    </div>
  </div>
  <div class="row">
    <span class="label">Warning</span>
    <div class="alert warning" role="alert">
      <i data-lucide="alert-triangle" class="icon"></i>
      <span class="message">请注意，当前设置可能会导致性能下降。</span>
    </div>
  </div>
  <div class="row">
    <span class="label">Error</span>
    <div class="alert error" role="alert">
      <i data-lucide="x-circle" class="icon"></i>
      <span class="message">保存失败，请检查网络连接后重试。</span>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
