<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form - 小亮主题</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: var(--space-3); background: var(--color-surface); font-family: var(--font-sans); color: var(--color-text); }
.row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
.label { width: 92px; flex-shrink: 0; font-size: var(--text-xs); color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }
.stage { display: flex; flex-direction: column; gap: var(--space-2); }

/* @component-css-start */
.form-field { display: flex; flex-direction: column; gap: var(--space-1); }
.form-field-label { font-size: var(--text-sm); line-height: 22px; color: var(--color-text); font-weight: var(--font-medium); }
.form-field-row { display: flex; align-items: center; gap: var(--space-3); }
.form-field-row .form-field-label { width: 72px; flex-shrink: 0; margin-bottom: 0; }
.form-inline { display: flex; align-items: flex-start; gap: var(--space-3); flex-wrap: wrap; }
.form-inline .form-field { flex-direction: row; align-items: center; gap: var(--space-2); }
.form-inline .form-field-label { width: auto; white-space: nowrap; }
.form-actions { display: flex; gap: var(--space-2); align-items: center; padding-top: var(--space-1); }
.form-field.error .form-field-label { color: var(--error); }
.form-field.success .form-field-label { color: var(--success); }
.form-item { animation: xl-rise-in var(--motion-duration-slow) var(--motion-ease-emphasized) both; animation-delay: calc(var(--reveal-index, 0) * var(--motion-stagger-step)); }
/* @component-css-end */
</style>
</head>
<body>
<div class="stage">
  <div class="row">
    <span class="label">垂直布局</span>
    <div class="form-field">
      <label class="form-field-label" for="vertical-email">邮箱</label>
      <div class="input-wrap">
        <input id="vertical-email" class="input" type="email" value="xiaoliang@example.com">
        <span class="input-hint">用于接收通知</span>
      </div>
    </div>
  </div>

  <div class="row">
    <span class="label">水平布局</span>
    <div class="form-field form-field-row">
      <label class="form-field-label" for="horizontal-username">用户名</label>
      <input id="horizontal-username" class="input" type="text" value="小亮">
    </div>
  </div>

  <div class="row">
    <span class="label">行内布局</span>
    <form class="form-inline" onsubmit="return false;">
      <div class="form-field">
        <label class="form-field-label" for="inline-email">邮箱</label>
        <input id="inline-email" class="input" type="email" value="xiaoliang@example.com">
      </div>
      <div class="form-field">
        <label class="form-field-label" for="inline-username">用户名</label>
        <input id="inline-username" class="input" type="text" value="小亮">
      </div>
      <div class="form-actions">
        <button class="btn btn-primary btn-md" type="submit">提交</button>
        <button class="btn btn-secondary btn-md" type="reset">重置</button>
      </div>
    </form>
  </div>

  <hr class="divider">

  <div class="row">
    <span class="label">错误状态</span>
    <div class="form-field error">
      <label class="form-field-label" for="error-email">邮箱</label>
      <div class="input-wrap">
        <input id="error-email" class="input error" type="email" value="example.com">
        <span class="input-hint error">邮箱格式不正确</span>
      </div>
    </div>
  </div>

  <div class="row">
    <span class="label">成功状态</span>
    <div class="form-field success">
      <label class="form-field-label" for="success-username">用户名</label>
      <div class="input-wrap">
        <input id="success-username" class="input success" type="text" value="xiaoliang">
        <span class="input-hint success">用户名可用</span>
      </div>
    </div>
  </div>

  <div class="row">
    <span class="label">禁用态</span>
    <div class="form-field">
      <label class="form-field-label" for="disabled-note">备注</label>
      <div class="input-wrap">
        <input id="disabled-note" class="input" type="text" value="已锁定的备注内容" disabled>
        <span class="input-hint">当前不可编辑</span>
      </div>
    </div>
  </div>
</div>
  <script src="_theme.js"></script>
</body>
</html>
