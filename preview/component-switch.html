<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Switch - 小亮主题</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: var(--space-3); background: var(--color-surface); font-family: var(--font-sans); color: var(--color-text); }
.row { display: flex; gap: var(--space-6); align-items: center; margin-bottom: var(--space-3); flex-wrap: wrap; }
.label { width: 92px; flex-shrink: 0; font-size: var(--text-xs); color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }

/* @component-css-start */
.switch { position: relative; display: inline-flex; align-items: center; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch-track { width: 40px; height: 24px; border-radius: var(--radius-full); background: var(--color-border); transition: background .15s; position: relative; flex-shrink: 0; }
.switch-track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--color-surface); box-shadow: var(--shadow-sm); transition: transform .15s; }
.switch input:checked + .switch-track { background: var(--color-primary); }
.switch input:checked + .switch-track::after { transform: translateX(16px); }
.switch input:focus-visible + .switch-track { outline: 2px solid var(--color-primary); outline-offset: 2px; }
.switch input:disabled + .switch-track { opacity: .5; cursor: not-allowed; }
.switch-track { transition: background-color var(--motion-duration-base) var(--motion-ease-standard), box-shadow var(--motion-duration-base) var(--motion-ease-standard); }
.switch-track::after { transition: transform var(--motion-duration-slow) var(--motion-ease-spring); }
/* @component-css-end */
</style>
</head>
<body>
<div class="row">
  <span class="label">开关</span>
  <label class="switch"><input type="checkbox" checked aria-label="启用通知"><span class="switch-track"></span></label>
  <label class="switch"><input type="checkbox" aria-label="启用自动保存"><span class="switch-track"></span></label>
  <label class="switch"><input type="checkbox" disabled aria-label="维护中"><span class="switch-track"></span></label>
</div>
  <script src="_theme.js"></script>
</body>
</html>
