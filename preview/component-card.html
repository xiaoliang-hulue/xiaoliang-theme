<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card - 小亮主题</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    /* Page scaffold — NOT extracted */
    body { margin: 0; padding: var(--space-3); background: var(--color-surface); font-family: var(--font-sans); color: var(--color-text); }
    .row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
    .label { width: 92px; flex-shrink: 0; font-size: var(--text-xs); line-height: 18px; font-weight: var(--font-medium); color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
    .divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }
    /* @component-css-start */
    /* Component definitions — extracted to components.css by deterministic script */
    .card { width: 100%; background: var(--color-surface-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-lg); }
    .card-default { padding: var(--space-6); }
    .card-compact { padding: var(--space-4); }
.card-interactive { padding: var(--space-6); cursor: pointer; transition: filter .15s; }
.card-interactive:hover { filter: brightness(0.97); }
.card-interactive:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
    .card-header { font-size: var(--text-lg); line-height: 30px; font-weight: var(--font-medium); margin-bottom: var(--space-2); }
    .card-body { font-size: var(--text-base); line-height: 26px; color: var(--color-text-secondary); margin-bottom: var(--space-4); }
    .card-compact .card-body { margin-bottom: var(--space-3); }
    .card-footer { font-size: var(--text-sm); line-height: 22px; color: var(--color-text-subtle); }
    .card-disabled { opacity: .55; pointer-events: none; filter: grayscale(.25); }
    /* @component-css-end */
  </style>
</head>
<body>
  <div class="row">
    <span class="label">Default</span>
    <div class="card card-default">
      <div class="card-header">默认卡片</div>
      <div class="card-body">用于分组展示内容，保持信息结构清晰。</div>
      <div class="card-footer">2024-01-15</div>
    </div>
  </div>
  <div class="row">
    <span class="label">Compact</span>
    <div class="card card-compact">
      <div class="card-header">紧凑卡片</div>
      <div class="card-body">在有限空间内展示摘要信息。</div>
      <div class="card-footer">2024-01-15</div>
    </div>
  </div>
  <hr class="divider">
  <div class="row">
    <span class="label">Interactive</span>
    <div class="card card-interactive" tabindex="0">
      <div class="card-header">可交互卡片</div>
      <div class="card-body">悬停时呈现状态反馈，提示用户可点击。</div>
      <div class="card-footer">2024-01-15</div>
    </div>
  </div>
  <div class="row">
    <span class="label">Disabled</span>
    <div class="card card-default card-disabled">
      <div class="card-header">禁用卡片</div>
      <div class="card-body">当前状态不可用，视觉降权显示。</div>
      <div class="card-footer">2024-01-15</div>
    </div>
  </div>
  <script src="_theme.js"></script>
</body>
</html>
