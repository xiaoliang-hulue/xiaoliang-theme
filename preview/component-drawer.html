<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: var(--space-6); background: var(--color-surface); font-family: var(--font-sans); color: var(--color-text); }
.trigger-row { display: flex; flex-wrap: wrap; gap: var(--space-3); }
.demo-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1); min-height: 36px; padding: var(--space-2) var(--space-4); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface-muted); color: var(--color-text); font-family: var(--font-sans); font-size: var(--text-sm); font-weight: var(--font-medium); cursor: pointer; }
.demo-btn.primary { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-on-primary); }
.demo-btn:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }

/* @component-css-start */
/* Component definitions — extracted to components.css by deterministic script */
.drawer-overlay {
  position: fixed;
  inset: 0;
  display: flex;
  background: rgba(0, 0, 0, .45);
  z-index: 100;
}
.drawer-overlay[hidden] { display: none; }

.drawer {
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 360px;
  height: 100%;
  margin-left: auto;
  background: var(--color-surface-elevated);
  border-left: 1px solid var(--color-border);
  box-shadow: var(--shadow-xl);
  animation: drawer-in-right .22s ease;
}

/* 方向：左侧 */
.drawer-overlay.left .drawer {
  margin-left: 0;
  margin-right: auto;
  border-left: none;
  border-right: 1px solid var(--color-border);
  animation-name: drawer-in-left;
}

/* 方向：底部 */
.drawer-overlay.bottom { align-items: flex-end; }
.drawer-overlay.bottom .drawer {
  width: 100%;
  max-width: none;
  height: auto;
  max-height: 70%;
  margin: 0;
  border: none;
  border-top: 1px solid var(--color-border);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  animation-name: drawer-in-bottom;
}

.drawer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  flex-shrink: 0;
  padding: var(--space-4) var(--space-5);
  border-bottom: 1px solid var(--color-border-subtle);
}
.drawer-title { font-size: var(--text-lg); font-weight: var(--font-medium); color: var(--color-text); }
.drawer-close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  flex-shrink: 0;
  border: none;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--color-text-muted);
  cursor: pointer;
}
.drawer-close:hover { background: var(--color-surface-muted); color: var(--color-text); }
.drawer-close:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
.drawer-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: var(--space-5);
  font-size: var(--text-base);
  line-height: 26px;
  color: var(--color-text-secondary);
}
.drawer-footer {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-3);
  flex-shrink: 0;
  padding: var(--space-4) var(--space-5);
  border-top: 1px solid var(--color-border-subtle);
}

@keyframes drawer-in-right { from { transform: translateX(100%); } to { transform: translateX(0); } }
@keyframes drawer-in-left  { from { transform: translateX(-100%); } to { transform: translateX(0); } }
@keyframes drawer-in-bottom { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (prefers-reduced-motion: reduce) {
  .drawer { animation: none; }
}
@media (max-width: 480px) {
  .drawer { max-width: 100%; }
}
.drawer-overlay:not([hidden]) { animation: xl-fade-in var(--motion-duration-base) var(--motion-ease-standard) both; }
.drawer-overlay.is-closing { animation: xl-fade-in var(--motion-duration-base) var(--motion-ease-standard) reverse both; }
.drawer-overlay.is-closing .drawer { animation-name: drawer-out-right; }
.drawer-overlay.is-closing.left .drawer { animation-name: drawer-out-left; }
.drawer-overlay.is-closing.bottom .drawer { animation-name: drawer-out-bottom; }
@keyframes drawer-out-right { from { transform: translateX(0); } to { transform: translateX(100%); } }
@keyframes drawer-out-left { from { transform: translateX(0); } to { transform: translateX(-100%); } }
@keyframes drawer-out-bottom { from { transform: translateY(0); } to { transform: translateY(100%); } }
/* @component-css-end */
</style>
</head>
<body>
<div class="trigger-row">
  <button class="demo-btn primary" type="button" data-drawer-open="#drawer-right">右侧抽屉</button>
  <button class="demo-btn" type="button" data-drawer-open="#drawer-left">左侧抽屉</button>
  <button class="demo-btn" type="button" data-drawer-open="#drawer-bottom">底部抽屉</button>
</div>

<div class="drawer-overlay" id="drawer-right" hidden>
  <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-right-title">
    <div class="drawer-header">
      <div class="drawer-title" id="drawer-right-title">筛选条件</div>
      <button class="drawer-close" type="button" data-drawer-close aria-label="关闭"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="drawer-body">从右侧滑入的侧边面板，适合承载筛选、详情与表单。按 ESC 或点击遮罩关闭，焦点被限制在面板内。</div>
    <div class="drawer-footer">
      <button class="demo-btn" type="button" data-drawer-close>重置</button>
      <button class="demo-btn primary" type="button" data-drawer-close>应用</button>
    </div>
  </div>
</div>

<div class="drawer-overlay left" id="drawer-left" hidden>
  <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-left-title">
    <div class="drawer-header">
      <div class="drawer-title" id="drawer-left-title">导航菜单</div>
      <button class="drawer-close" type="button" data-drawer-close aria-label="关闭"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="drawer-body">从左侧滑入，常用于移动端的主导航抽屉。</div>
  </div>
</div>

<div class="drawer-overlay bottom" id="drawer-bottom" hidden>
  <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-bottom-title">
    <div class="drawer-header">
      <div class="drawer-title" id="drawer-bottom-title">更多操作</div>
      <button class="drawer-close" type="button" data-drawer-close aria-label="关闭"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="drawer-body">从底部升起的动作面板（Action Sheet），适合移动端的快捷操作列表。</div>
    <div class="drawer-footer">
      <button class="demo-btn" type="button" data-drawer-close>取消</button>
    </div>
  </div>
</div>

<script src="../theme.js"></script>
  <script src="_theme.js"></script>
</body>
</html>
