<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: var(--space-3); background: var(--color-surface); font-family: var(--font-sans); color: var(--color-text); }
.specimen { max-width: 560px; margin: 0 auto; border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; background: var(--color-surface); }
.stage { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3); background: var(--color-surface-muted); }
.story { display: grid; grid-template-columns: 92px minmax(0,1fr); align-items: start; gap: var(--space-2); padding: var(--space-2); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-md); background: var(--color-surface); }
.story-label { font-size: var(--text-xs); color: var(--color-text-secondary); text-transform: uppercase; width: 92px; min-width: 0; max-width: 92px; flex-shrink: 0; white-space: normal; overflow: hidden; overflow-wrap: anywhere; line-height: 1.25; }
.rail { min-width: 0; }
.divider { border: none; border-top: 1px solid var(--color-border-subtle); margin: var(--space-1) 0; }
@media(max-width:460px) { .story { grid-template-columns: 1fr; gap: var(--space-2); } .story-label { width: auto; max-width: none; } }

/* @component-css-start */
/* Component definitions — extracted to components.css by deterministic script */
.tabs { border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); overflow: hidden; }
.tablist { display: flex; gap: var(--space-1); padding: var(--space-2) var(--space-2) 0; border-bottom: 1px solid var(--color-border-subtle); overflow-x: auto; }
.tab {
  appearance: none; border: none; background: transparent; cursor: pointer;
  padding: var(--space-2) var(--space-3); margin-bottom: -1px;
  font-family: var(--font-sans); font-size: var(--text-sm); color: var(--color-text-secondary);
  border-bottom: 2px solid transparent; border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  white-space: nowrap; transition: color .15s, border-color .15s, background-color .15s;
}
.tab:hover { color: var(--color-text); background: var(--color-surface-muted); }
.tab:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }
.tab[aria-selected="true"] { color: var(--color-primary); border-bottom-color: var(--color-primary); font-weight: var(--font-medium); }
.tabpanel { padding: var(--space-4); color: var(--color-text-subtle); font-size: var(--text-sm); line-height: 1.6; }
.tabpanel[hidden] { display: none; }
.tab { transition: background-color var(--motion-duration-base) var(--motion-ease-standard), color var(--motion-duration-base) var(--motion-ease-standard); }
.tabpanel:not([hidden]) { animation: xl-fade-in var(--motion-duration-slow) var(--motion-ease-emphasized) both; }
/* @component-css-end */
</style>
</head>
<body>
<main class="specimen">
<div class="stage">
<section class="story" data-evidence-sample="default"><span class="story-label">默认</span><div class="rail">
<div class="tabs" data-tabs>
  <div class="tablist" role="tablist" aria-label="示例标签页">
    <button class="tab" role="tab" id="demo-tab-1" aria-controls="demo-panel-1" aria-selected="true" tabindex="0">概览</button>
    <button class="tab" role="tab" id="demo-tab-2" aria-controls="demo-panel-2" aria-selected="false" tabindex="-1">详情</button>
    <button class="tab" role="tab" id="demo-tab-3" aria-controls="demo-panel-3" aria-selected="false" tabindex="-1">设置</button>
  </div>
  <div class="tabpanel" role="tabpanel" id="demo-panel-1" aria-labelledby="demo-tab-1">概览内容：展示关键指标与最近动态。</div>
  <div class="tabpanel" role="tabpanel" id="demo-panel-2" aria-labelledby="demo-tab-2" hidden>详情内容：展示完整的字段与历史记录。</div>
  <div class="tabpanel" role="tabpanel" id="demo-panel-3" aria-labelledby="demo-tab-3" hidden>设置内容：调整偏好与通知方式。</div>
</div>
</div></section>
<hr class="divider">
<section class="story" data-evidence-sample="note"><span class="story-label">说明</span><div class="rail">
<p class="input-hint">使用方向键 ← / →、Home / End 在标签间移动；切换由 <code>theme.js</code> 的 <code>XL.initTabs()</code> 提供（自动激活模式）。</p>
</div></section>
</div>
</main>
<script src="../theme.js"></script>
  <script src="_theme.js"></script>
</body>
</html>
