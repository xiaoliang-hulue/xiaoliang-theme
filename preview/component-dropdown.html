<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dropdown - 小亮主题</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: var(--space-3); background: var(--color-surface); font-family: var(--font-sans); color: var(--color-text); }

/* @component-css-start */
.dropdown { position: relative; display: inline-flex; }
.dropdown-menu { position: absolute; top: calc(100% + var(--space-1)); left: 0; min-width: 180px; background: var(--color-surface-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--shadow-md); z-index: 50; }
.dropdown-item { display: flex; align-items: center; gap: var(--space-2); width: 100%; padding: var(--space-2) var(--space-3); font-size: var(--text-sm); line-height: 22px; color: var(--color-text); background: transparent; border: none; text-align: left; cursor: pointer; }
.dropdown-item:hover { background: var(--color-surface-muted); }
.dropdown-item:first-child { border-radius: var(--radius-md) var(--radius-md) 0 0; }
.dropdown-item:last-child { border-radius: 0 0 var(--radius-md) var(--radius-md); }
.dropdown-divider { height: 1px; margin: var(--space-1) 0; background: var(--color-border-subtle); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1); border: 1px solid transparent; border-radius: var(--radius-md); cursor: pointer; font-family: var(--font-sans); font-weight: var(--font-medium); white-space: nowrap; }
.btn-md { min-height: 36px; padding: var(--space-2) var(--space-4); font-size: var(--text-sm); }
.btn-secondary { background: var(--color-surface-muted); color: var(--color-text); border-color: var(--color-border); }
/* @component-css-end */
</style>
</head>
<body>
<div class="dropdown">
  <button class="btn btn-secondary btn-md" type="button">操作菜单</button>
  <div class="dropdown-menu">
    <button class="dropdown-item" type="button">编辑</button>
    <button class="dropdown-item" type="button">复制</button>
    <div class="dropdown-divider"></div>
    <button class="dropdown-item" type="button" style="color: var(--error);">删除</button>
  </div>
</div>
</body>
</html>
