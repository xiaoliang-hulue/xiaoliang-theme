<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: var(--space-3); background: var(--color-surface); font-family: var(--font-sans); color: var(--color-text); }
.specimen { max-width: 100%; margin: 0 auto; border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; background: var(--color-surface); }
.stage { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3); background: var(--color-surface-muted); }
.story { display: grid; grid-template-columns: 92px minmax(0,1fr); align-items: center; gap: var(--space-2); padding: var(--space-2); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-md); background: var(--color-surface); }
.story-label { font-size: var(--text-xs); color: var(--color-text-secondary); text-transform: uppercase; width: 92px; min-width: 0; max-width: 92px; flex-shrink: 0; white-space: normal; overflow: hidden; overflow-wrap: anywhere; line-height: 1.25; }
.rail { display: flex; flex-direction: column; min-width: 0; gap: var(--space-3); align-items: stretch; padding: var(--space-2); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-md); background: var(--color-surface-muted); }
.divider { border: none; border-top: 1px solid var(--color-border-subtle); margin: var(--space-1) 0; }
@media(max-width:460px) { .story { grid-template-columns: 1fr; gap: var(--space-2); } .story-label { width: auto; max-width: none; } }

/* @component-css-start */
/* Component definitions — extracted to components.css by deterministic script */
.progress {
  position: relative;
  width: 100%;
  height: 8px;
  background: var(--color-surface-muted);
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-full);
  overflow: hidden;
}
.progress-bar {
  display: block;
  height: 100%;
  width: 0;
  background: var(--color-primary);
  border-radius: inherit;
  transition: width .3s ease;
}

/* 尺寸 */
.progress.sm { height: 4px; }
.progress.lg { height: 12px; }

/* 语义色 */
.progress-bar.success { background: var(--success); }
.progress-bar.warning { background: var(--warning); }
.progress-bar.error { background: var(--error); }

/* 标签行 */
.progress-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-2);
  margin-bottom: var(--space-1);
  font-family: var(--font-sans);
  font-size: var(--text-xs);
  color: var(--color-text-secondary);
}
.progress-value { color: var(--color-text); font-weight: var(--font-medium); font-variant-numeric: tabular-nums; }

/* 不确定进度 */
.progress.indeterminate { overflow: hidden; }
.progress.indeterminate .progress-bar {
  width: 40%;
  animation: progress-slide 1.4s ease-in-out infinite;
}
@keyframes progress-slide {
  0%   { transform: translateX(-110%); }
  100% { transform: translateX(260%); }
}

@media (prefers-reduced-motion: reduce) {
  .progress-bar { transition: none; }
  .progress.indeterminate .progress-bar { animation: none; width: 100%; opacity: .55; }
}
@media (forced-colors: active) {
  .progress { border: 1px solid CanvasText; }
  .progress-bar { background: Highlight; }
}
/* @component-css-end */
</style>
</head>
<body>
<main class="specimen">
<div class="stage">
<section class="story" data-evidence-sample="default"><span class="story-label">默认</span><div class="rail">
<div class="progress" role="progressbar" aria-label="上传进度" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">
  <span class="progress-bar" style="width:60%"></span>
</div>
</div></section>
<hr class="divider">
<section class="story" data-evidence-sample="labeled"><span class="story-label">带标签</span><div class="rail">
<div>
  <div class="progress-label"><span>文件上传中</span><span class="progress-value">72%</span></div>
  <div class="progress" role="progressbar" aria-label="文件上传中" aria-valuenow="72" aria-valuemin="0" aria-valuemax="100">
    <span class="progress-bar" style="width:72%"></span>
  </div>
</div>
</div></section>
<hr class="divider">
<section class="story" data-evidence-sample="sizes"><span class="story-label">尺寸</span><div class="rail">
<div class="progress sm" role="progressbar" aria-label="细进度条" aria-valuenow="35" aria-valuemin="0" aria-valuemax="100"><span class="progress-bar" style="width:35%"></span></div>
<div class="progress" role="progressbar" aria-label="标准进度条" aria-valuenow="55" aria-valuemin="0" aria-valuemax="100"><span class="progress-bar" style="width:55%"></span></div>
<div class="progress lg" role="progressbar" aria-label="粗进度条" aria-valuenow="85" aria-valuemin="0" aria-valuemax="100"><span class="progress-bar" style="width:85%"></span></div>
</div></section>
<hr class="divider">
<section class="story" data-evidence-sample="semantic"><span class="story-label">语义色</span><div class="rail">
<div class="progress" role="progressbar" aria-label="已完成" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"><span class="progress-bar success" style="width:100%"></span></div>
<div class="progress" role="progressbar" aria-label="存储告警" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100"><span class="progress-bar warning" style="width:80%"></span></div>
<div class="progress" role="progressbar" aria-label="配额超限" aria-valuenow="95" aria-valuemin="0" aria-valuemax="100"><span class="progress-bar error" style="width:95%"></span></div>
</div></section>
<hr class="divider">
<section class="story" data-evidence-sample="indeterminate"><span class="story-label">不确定</span><div class="rail">
<div class="progress indeterminate" role="progressbar" aria-label="处理中"><span class="progress-bar"></span></div>
</div></section>
</div>
</main>
</body>
</html>
