<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SideNav - 小亮主题</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: var(--space-3); background: var(--color-surface); font-family: var(--font-sans); color: var(--color-text); }

/* @component-css-start */
.sidenav { width: 240px; min-height: 320px; padding: var(--space-4); background: var(--color-surface-elevated); border-right: 1px solid var(--color-border); box-sizing: border-box; }
.sidenav-section { margin-bottom: var(--space-4); }
.sidenav-section-title { padding: var(--space-2) var(--space-3); font-size: var(--text-xs); font-weight: var(--font-medium); text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-text-muted); }
.sidenav-link { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--color-text-secondary); border-radius: var(--radius-md); text-decoration: none; }
.sidenav-link:hover { color: var(--color-text); background: var(--color-surface-muted); }
.sidenav-link.active { color: var(--color-primary); background: var(--color-primary-subtle); }
.sidenav-link:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
.sidenav-link { transition: background-color var(--motion-duration-base) var(--motion-ease-standard), color var(--motion-duration-base) var(--motion-ease-standard), transform var(--motion-duration-base) var(--motion-ease-standard), box-shadow var(--motion-duration-base) var(--motion-ease-standard); }
.sidenav-link:hover { transform: translateX(var(--motion-distance-sm)); }
.sidenav-link.active { box-shadow: inset 3px 0 0 var(--color-primary); }
/* 入场动效：对齐 page-dashboard 的错峰上浮 + 淡入（reduced-motion 由全局兜底强制降级） */
.sidenav-section-title { animation: xl-fade-in var(--motion-duration-emphasis) var(--motion-ease-standard) backwards; }
.sidenav-link { animation: xl-rise-in var(--motion-duration-emphasis) var(--motion-ease-emphasized) backwards; }
.sidenav-link:nth-of-type(1) { animation-delay: calc(1 * var(--motion-stagger-step)); }
.sidenav-link:nth-of-type(2) { animation-delay: calc(2 * var(--motion-stagger-step)); }
.sidenav-link:nth-of-type(3) { animation-delay: calc(3 * var(--motion-stagger-step)); }
.sidenav-section:nth-of-type(2) .sidenav-section-title { animation-delay: calc(4 * var(--motion-stagger-step)); }
.sidenav-section:nth-of-type(2) .sidenav-link:nth-of-type(1) { animation-delay: calc(5 * var(--motion-stagger-step)); }
.sidenav-section:nth-of-type(2) .sidenav-link:nth-of-type(2) { animation-delay: calc(6 * var(--motion-stagger-step)); }
/* @component-css-end */
</style>
</head>
<body>
<nav class="sidenav" aria-label="侧边导航">
  <div class="sidenav-section">
    <div class="sidenav-section-title">工作台</div>
    <a href="#" class="sidenav-link active">概览</a>
    <a href="#" class="sidenav-link">项目</a>
    <a href="#" class="sidenav-link">数据</a>
  </div>
  <div class="sidenav-section">
    <div class="sidenav-section-title">管理</div>
    <a href="#" class="sidenav-link">成员</a>
    <a href="#" class="sidenav-link">设置</a>
  </div>
</nav>
  <script src="_theme.js"></script>
</body>
</html>
