<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button - 小亮主题</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: var(--space-3); background: var(--color-surface); font-family: var(--font-sans); color: var(--color-text); }
.row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
.label { width: 92px; flex-shrink: 0; font-size: var(--text-xs); color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }

/* @component-css-start */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1); border: 1px solid transparent; border-radius: var(--radius-md); cursor: pointer; font-family: var(--font-sans); font-weight: var(--font-medium); white-space: nowrap; transition: background .15s, border-color .15s; flex-shrink: 0; }
.btn:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
.btn-sm { min-height: 28px; min-width: 28px; padding: var(--space-1) var(--space-3); font-size: var(--text-xs); }
.btn-md { min-height: 36px; min-width: 36px; padding: var(--space-2) var(--space-4); font-size: var(--text-sm); }
.btn-lg { min-height: 44px; min-width: 44px; padding: var(--space-3) var(--space-5); font-size: var(--text-base); }
.btn-primary { background: var(--color-primary); color: var(--color-on-primary); border-color: transparent; }
.btn-primary:hover { background: var(--color-primary-hover); }
.btn-primary[disabled] { background: var(--color-border); color: var(--color-text-muted); cursor: not-allowed; pointer-events: none; }
.btn-secondary { background: var(--color-surface-muted); color: var(--color-text); border-color: var(--color-border); }
.btn-secondary:hover { background: var(--color-border-subtle); }
.btn-secondary[disabled] { background: var(--color-border-subtle); color: var(--color-text-muted); cursor: not-allowed; pointer-events: none; }
.btn-ghost { background: transparent; color: var(--color-primary); border-color: transparent; }
.btn-ghost:hover { background: var(--color-primary-subtle); }
.btn-ghost[disabled] { color: var(--color-text-muted); background: transparent; cursor: not-allowed; pointer-events: none; }
.btn-danger { background: var(--error); color: var(--color-on-primary); border-color: transparent; }
.btn-danger:hover { filter: brightness(1.08); }
.btn-danger[disabled] { background: var(--color-border); color: var(--color-text-muted); cursor: not-allowed; pointer-events: none; }
.btn-loading { position: relative; color: transparent !important; pointer-events: none; }
.btn-loading::after { content: ""; position: absolute; width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: var(--radius-full); animation: btn-spin 1s linear infinite; color: inherit; }
.btn-primary.btn-loading::after { border-color: var(--color-on-primary); border-right-color: transparent; }
.btn-secondary.btn-loading::after, .btn-ghost.btn-loading::after, .btn-danger.btn-loading::after { border-color: currentColor; border-right-color: transparent; }
@keyframes btn-spin { to { transform: rotate(360deg); } }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">主要</span><button class="btn btn-primary btn-md" type="button">保存</button></div>
<div class="row"><span class="label">次要</span><button class="btn btn-secondary btn-md" type="button">取消</button></div>
<div class="row"><span class="label">幽灵</span><button class="btn btn-ghost btn-md" type="button">查看</button></div>
<div class="row"><span class="label">危险</span><button class="btn btn-danger btn-md" type="button">删除</button></div>
<hr class="divider">
<div class="row"><span class="label">尺寸</span><button class="btn btn-primary btn-sm" type="button">小按钮</button><button class="btn btn-primary btn-md" type="button">默认</button><button class="btn btn-primary btn-lg" type="button">大按钮</button></div>
<div class="row"><span class="label">禁用</span><button class="btn btn-primary btn-md" type="button">可用</button><button class="btn btn-primary btn-md" type="button" disabled>不可用</button></div>
<div class="row"><span class="label">加载</span><button class="btn btn-primary btn-md btn-loading" type="button">加载中</button><button class="btn btn-secondary btn-md btn-loading" type="button">加载中</button><button class="btn btn-ghost btn-md btn-loading" type="button">加载中</button></div>
</body>
</html>
