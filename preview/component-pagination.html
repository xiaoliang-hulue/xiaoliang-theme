<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagination - 小亮主题</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: var(--space-3); background: var(--color-surface); font-family: var(--font-sans); color: var(--color-text); }
.row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
.label { width: 92px; flex-shrink: 0; font-size: var(--text-xs); color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }

/* @component-css-start */
.pagination { display: inline-flex; align-items: center; gap: var(--space-1); list-style: none; margin: 0; padding: 0; }
.page-item { display: inline-flex; }
.page-link,
.page-ellipsis {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 36px;
  height: 36px;
  padding: 0 var(--space-2);
  font-size: var(--text-sm);
  font-weight: var(--font-medium);
  line-height: 1;
  color: var(--color-text);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
  text-decoration: none;
  user-select: none;
}
.page-link:hover:not([disabled]):not(.active) { background: var(--color-surface-muted); }
.page-link:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
.page-link.active {
  color: var(--color-on-primary);
  background: var(--color-primary);
  border-color: var(--color-primary);
  cursor: default;
}
.page-link[disabled] {
  color: var(--color-text-muted);
  background: var(--color-surface);
  border-color: var(--color-border);
  cursor: not-allowed;
  pointer-events: none;
}
.page-ellipsis {
  cursor: default;
  border-color: transparent;
  background: transparent;
  color: var(--color-text-secondary);
  min-width: auto;
  padding: 0 var(--space-1);
}
.pagination-sm .page-link,
.pagination-sm .page-ellipsis {
  min-width: 28px;
  height: 28px;
  padding: 0 var(--space-1);
  font-size: var(--text-xs);
  border-radius: var(--radius-sm);
}
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">默认尺寸</span>
  <ul class="pagination">
    <li class="page-item"><button class="page-link" type="button" disabled>&lt;</button></li>
    <li class="page-item"><button class="page-link active" type="button">1</button></li>
    <li class="page-item"><button class="page-link" type="button">2</button></li>
    <li class="page-item"><button class="page-link" type="button">3</button></li>
    <li class="page-item"><span class="page-ellipsis">...</span></li>
    <li class="page-item"><button class="page-link" type="button">10</button></li>
    <li class="page-item"><button class="page-link" type="button">&gt;</button></li>
  </ul>
</div>
<div class="row"><span class="label">小尺寸</span>
  <ul class="pagination pagination-sm">
    <li class="page-item"><button class="page-link" type="button">&lt;</button></li>
    <li class="page-item"><button class="page-link" type="button">1</button></li>
    <li class="page-item"><span class="page-ellipsis">...</span></li>
    <li class="page-item"><button class="page-link active" type="button">5</button></li>
    <li class="page-item"><button class="page-link" type="button">6</button></li>
    <li class="page-item"><button class="page-link" type="button">&gt;</button></li>
  </ul>
</div>
<hr class="divider">
<div class="row"><span class="label">禁用态</span>
  <ul class="pagination">
    <li class="page-item"><button class="page-link" type="button" disabled>&lt; 上一页</button></li>
    <li class="page-item"><button class="page-link active" type="button">1</button></li>
    <li class="page-item"><button class="page-link" type="button">2</button></li>
    <li class="page-item"><button class="page-link" type="button" disabled>下一页 &gt;</button></li>
  </ul>
</div>
<div class="row"><span class="label">省略号</span>
  <ul class="pagination">
    <li class="page-item"><button class="page-link" type="button">1</button></li>
    <li class="page-item"><span class="page-ellipsis">...</span></li>
    <li class="page-item"><button class="page-link" type="button">4</button></li>
    <li class="page-item"><button class="page-link active" type="button">5</button></li>
    <li class="page-item"><button class="page-link" type="button">6</button></li>
    <li class="page-item"><span class="page-ellipsis">...</span></li>
    <li class="page-item"><button class="page-link" type="button">20</button></li>
  </ul>
</div>
  <script src="_theme.js"></script>
</body>
</html>
