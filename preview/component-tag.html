<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tag</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    /* Page scaffold — NOT extracted */
    body { margin: 0; padding: var(--space-3); background: var(--color-surface); font-family: var(--font-sans); color: var(--color-text); }
    .row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
    .label { width: 92px; font-size: var(--text-xs); color: var(--color-text-secondary); font-weight: var(--font-medium); text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; }
    .divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }

    /* @component-css-start */
    /* Component definitions — extracted to components.css by deterministic script */
    .tag { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; min-width: 24px; height: 24px; padding: var(--space-1) var(--space-2); border: 1px solid transparent; font-size: var(--text-xs); font-weight: var(--font-medium); line-height: 16px; white-space: nowrap; transition: filter .15s; cursor: default; }
    .tag-rounded { border-radius: var(--radius-md); }
    .tag-pill { border-radius: var(--radius-full); }
    .tag-default { background: var(--color-surface-muted); color: var(--color-text-secondary); border-color: var(--color-border); }
    .tag-primary { background: var(--color-primary-subtle); color: var(--color-primary); }
    .tag-success { background: var(--success-bg); color: var(--success); }
    .tag-warning { background: var(--warning-bg); color: var(--warning); }
    .tag-error { background: var(--error-bg); color: var(--error); }
    .tag:hover { filter: brightness(1.08); }
.tag { transition: transform var(--motion-duration-base) var(--motion-ease-spring), background-color var(--motion-duration-fast) var(--motion-ease-standard), color var(--motion-duration-fast) var(--motion-ease-standard), filter var(--motion-duration-fast) var(--motion-ease-standard); }
.tag:hover { transform: translateY(calc(-1 * var(--motion-distance-sm))) scale(var(--motion-scale-hover)); }
    /* @component-css-end */
  </style>
</head>
<body>
  <div class="row">
    <span class="label">Rounded</span>
    <span class="tag tag-rounded tag-default">标签</span>
    <span class="tag tag-rounded tag-primary">主要</span>
    <span class="tag tag-rounded tag-success">成功</span>
    <span class="tag tag-rounded tag-warning">警告</span>
    <span class="tag tag-rounded tag-error">错误</span>
  </div>
  <hr class="divider">
  <div class="row">
    <span class="label">Pill</span>
    <span class="tag tag-pill tag-primary">主要</span>
  </div>
  <script src="_theme.js"></script>
</body>
</html>
